apiVersion: apps/v1
kind: Deployment
metadata:
  name: dxp-llm-service
  labels:
    app: dxp-llm-service
    dxp.io/managed: "true"
spec:
  replicas: 1
  selector:
    matchLabels:
      app: dxp-llm-service
  template:
    metadata:
      labels:
        app: dxp-llm-service
        backstage.io/kubernetes-id: dxp-llm-service
    spec:
      nodeSelector:
        role: workload
      tolerations:
      - key: role
        operator: Equal
        value: workload
        effect: NoSchedule
      containers:
      - name: dxp-llm-service
        image: harbor.dxp/dxp/dxp-llm-service:latest
        imagePullPolicy: Always
        envFrom:
        # S105 -- token renomme (etait PLACEHOLDER_DB_SECRET, majuscules
        # + underscore invalides pour un nom K8s -- RFC 1123 -- faisait
        # echouer la sync ArgoCD pour TOUT service sans BDD liee, y compris
        # ceux deja e2e-valides). Substitue par dxp-app-link-database.yaml
        # uniquement si un service-ref database est ajoute apres coup.
        - secretRef:
            name: placeholder-db-secret
            optional: true
        ports:
        - containerPort: 8000
        env:
        - name: BACKEND_URL
          value: ""
        - name: LITELLM_URL
          value: "http://litellm.llmops.svc.cluster.local:4000"
        - name: LITELLM_API_KEY
          # S114 (L0b, #152) -- jamais en clair : Secret cree par DxP au
          # provisioning dans le namespace du service. Non optionnel : un
          # Secret absent bloque le demarrage du pod (CreateContainerConfigError)
          # au lieu de produire des appels refuses par LiteLLM.
          valueFrom:
            secretKeyRef:
              name: dxp-llm-dxp-llm-service
              key: LITELLM_API_KEY
        resources:
          requests:
            cpu: 50m
            memory: 64Mi
          limits:
            cpu: 200m
            memory: 256Mi
        livenessProbe:
          httpGet:
            path: /health
            port: 8000
          initialDelaySeconds: 10
          periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: dxp-llm-service
spec:
  selector:
    app: dxp-llm-service
  ports:
  - port: 80
    targetPort: 8000
  type: ClusterIP
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: dxp-llm-service
  labels:
    app: dxp-llm-service
    dxp.io/managed: "true"
spec:
  ingressClassName: nginx
  # S91 -- tls: sans secretName ajoute (chantier retrait HTTP). Necessaire
  # pour que ssl-redirect=true (ConfigMap controleur ingress-nginx)
  # produise un effet reel : la fonction certificate_configured_for_current_request()
  # d'ingress-nginx (lua_ingress.lua) exige un cert explicitement enregistre
  # pour CE host precis avant d'autoriser la redirection HTTP->HTTPS -- le
  # default-ssl-certificate seul (dxp-platform-tls) ne suffit pas, meme s'il
  # sert bien de fallback pour le handshake TLS lui-meme. Verifie en
  # conditions reelles (S91, cristal-backend). Pas de secretName : continue
  # a utiliser le certificat par defaut du controleur, ce bloc sert
  # uniquement a enregistrer le host aupres du mecanisme de redirection.
  tls:
  - hosts:
    - dxp-llm-service.68.221.5.247.nip.io
  rules:
  - host: dxp-llm-service.68.221.5.247.nip.io
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: dxp-llm-service
            port:
              number: 80
